<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Focus timer</title>
<style>
  :root {
    --bg: #f3f1ec; --card: #ffffff; --ink: #1d1b18; --muted: #6c675f; --faint: #a8a299; --rule: #e2ddd4;
    --work: #e0533d; --short: #2c9c74; --long: #3b6fd4; --track: #ece7de;
    --shadow: 0 1px 2px rgba(29,27,24,.06), 0 18px 40px -26px rgba(29,27,24,.45);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121110; --card: #1c1a18; --ink: #f1ede6; --muted: #a59f95; --faint: #6a655d; --rule: #2e2b27;
      --work: #ff7a62; --short: #4fcf9f; --long: #79a2ff; --track: #2a2724;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 18px 40px -26px rgba(0,0,0,.9);
    }
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); color: var(--ink); }
  body { margin: 0; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 980px; margin: 0 auto; padding: 40px 20px 80px; }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  header { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 8px; }
  h1 { font: 800 34px/1.1 "Avenir Next", "Helvetica Neue", system-ui, sans-serif; letter-spacing: -.02em; margin: 0; }
  h2 { font: 700 15px/1 system-ui, sans-serif; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); margin: 0 0 14px; }
  .sub { color: var(--muted); font-size: 14px; }
  .layout { display: grid; grid-template-columns: 1.15fr 1fr; gap: 20px; margin-top: 24px; }
  @media (max-width: 820px) { .layout { grid-template-columns: 1fr; } }
  .card { background: var(--card); border: 1px solid var(--rule); border-radius: 20px; padding: 22px; box-shadow: var(--shadow); }
  .modes { display: inline-flex; background: var(--track); border-radius: 999px; padding: 4px; gap: 2px; }
  .modes button { border: 0; background: transparent; color: var(--muted); font: 600 14px system-ui, sans-serif; padding: 8px 16px; border-radius: 999px; cursor: pointer; transition: background .2s, color .2s; }
  .modes button.on { background: var(--card); color: var(--accent); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .timer { display: flex; flex-direction: column; align-items: center; gap: 18px; }
  .ring { position: relative; width: min(340px, 80vw); aspect-ratio: 1; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring .track { stroke: var(--track); }
  .ring .arc { stroke: var(--accent); stroke-linecap: round; transition: stroke .4s; }
  .ring .tip { fill: var(--accent); transition: fill .4s; }
  .ring .face { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .ring .time { font: 700 72px/1 ui-monospace, Menlo, monospace; letter-spacing: -.04em; font-variant-numeric: tabular-nums; }
  .ring .label { color: var(--muted); font-size: 14px; letter-spacing: .08em; text-transform: uppercase; margin-top: 6px; }
  .ring.done .time { animation: pulse 1s ease-in-out 3; }
  @keyframes pulse { 50% { transform: scale(1.08); color: var(--accent); } }
  .ring.running .tip { animation: glow 2s ease-in-out infinite; }
  @keyframes glow { 50% { opacity: .55; } }
  .controls { display: flex; gap: 10px; align-items: center; }
  .btn { font: 600 15px system-ui, sans-serif; padding: 11px 18px; border-radius: 12px; border: 1px solid var(--rule); background: var(--card); color: var(--ink); cursor: pointer; transition: transform .1s, background .2s; }
  .btn:active { transform: scale(.96); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; min-width: 120px; font-size: 17px; }
  .dots { display: flex; gap: 8px; align-items: center; }
  .dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--work); transition: background .3s; }
  .dot.full { background: var(--work); }
  .dot.now { box-shadow: 0 0 0 4px color-mix(in srgb, var(--work) 25%, transparent); }
  .keys { color: var(--faint); font-size: 12px; }
  kbd { font: 11px ui-monospace, monospace; border: 1px solid var(--rule); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; color: var(--muted); }
  .settings { display: grid; gap: 14px; }
  .set { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; }
  .set label { font-size: 14px; color: var(--muted); }
  .set output { font: 700 14px ui-monospace, monospace; }
  .set input[type=range] { grid-column: 1 / -1; width: 100%; }
  .set.work input { accent-color: var(--work); } .set.short input { accent-color: var(--short); } .set.long input { accent-color: var(--long); }
  .check { display: flex; gap: 8px; align-items: center; font-size: 14px; color: var(--muted); cursor: pointer; }
  .stack { display: grid; gap: 20px; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .stat { background: var(--track); border-radius: 12px; padding: 10px 12px; }
  .stat b { display: block; font: 800 24px/1.1 ui-monospace, monospace; }
  .stat span { font-size: 12px; color: var(--muted); }
  .chart svg { width: 100%; height: 150px; display: block; }
  .chart rect.bar { fill: var(--work); transition: height .5s, y .5s; }
  .chart rect.bar.now { fill: color-mix(in srgb, var(--work) 55%, transparent); }
  .chart text { font: 11px ui-monospace, monospace; fill: var(--faint); }
  .log { list-style: none; margin: 0; padding: 0; max-height: 230px; overflow-y: auto; }
  .log li { display: grid; grid-template-columns: 56px 12px 1fr auto; gap: 10px; align-items: center; padding: 7px 4px; border-bottom: 1px dashed var(--rule); font-size: 14px; animation: slide .35s ease-out; }
  .log li:last-child { border-bottom: 0; }
  .log .sw { width: 10px; height: 10px; border-radius: 3px; }
  .log .t { color: var(--muted); font-family: ui-monospace, monospace; font-size: 13px; }
  .log .m { font-family: ui-monospace, monospace; color: var(--muted); }
  .log .skipped { color: var(--faint); text-decoration: line-through; }
  @keyframes slide { from { opacity: 0; transform: translateY(-6px); } }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 120px); background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 12px; font-size: 14px; transition: transform .35s cubic-bezier(.3,.7,.2,1); }
  .toast.show { transform: translate(-50%, 0); }
</style>
</head>
<body>
<main>
  <header>
    <h1>Focus timer</h1>
    <div class="sub" id="today"></div>
  </header>

  <div class="layout">
    <section class="card timer">
      <div class="modes" role="tablist">
        <button data-mode="work">Focus</button>
        <button data-mode="short">Short break</button>
        <button data-mode="long">Long break</button>
      </div>
      <div class="ring" id="ring">
        <svg viewBox="0 0 200 200">
          <circle class="track" cx="100" cy="100" r="88" fill="none" stroke-width="12"/>
          <circle class="arc" id="arc" cx="100" cy="100" r="88" fill="none" stroke-width="12"/>
          <circle class="tip" id="tip" cx="188" cy="100" r="7"/>
        </svg>
        <div class="face">
          <div class="time" id="time">25:00</div>
          <div class="label" id="label">Focus</div>
        </div>
      </div>
      <div class="dots" id="dots" title="Focus sessions in this round"></div>
      <div class="controls">
        <button class="btn" id="reset" title="Reset (R)">Reset</button>
        <button class="btn primary" id="go">Start</button>
        <button class="btn" id="skip" title="Skip (S)">Skip</button>
      </div>
      <div class="keys"><kbd>Space</kbd> start/pause · <kbd>R</kbd> reset · <kbd>S</kbd> skip · <kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> mode</div>
    </section>

    <div class="stack">
      <section class="card">
        <h2>Lengths</h2>
        <div class="settings">
          <div class="set work"><label for="lw">Focus</label><output id="ow"></output><input id="lw" type="range" min="5" max="60" step="5"></div>
          <div class="set short"><label for="ls">Short break</label><output id="os"></output><input id="ls" type="range" min="1" max="15" step="1"></div>
          <div class="set long"><label for="ll">Long break</label><output id="ol"></output><input id="ll" type="range" min="5" max="40" step="5"></div>
          <label class="check"><input type="checkbox" id="auto"> Start the next session on its own</label>
        </div>
      </section>
      <section class="card">
        <h2>Today</h2>
        <div class="stats">
          <div class="stat"><b id="sFocus">0</b><span>focus minutes</span></div>
          <div class="stat"><b id="sDone">0</b><span>sessions done</span></div>
          <div class="stat"><b id="sStreak">0</b><span>in a row</span></div>
        </div>
        <div class="chart"><svg id="chart" viewBox="0 0 400 150" preserveAspectRatio="none"></svg></div>
      </section>
    </div>
  </div>

  <section class="card" style="margin-top:20px">
    <h2>Session log</h2>
    <ul class="log" id="log"></ul>
  </section>
</main>
<div class="toast" id="toast"></div>

<script>
const MODES = {
  work:  { name: "Focus",       color: "--work" },
  short: { name: "Short break", color: "--short" },
  long:  { name: "Long break",  color: "--long" },
};
const ROUND = 4;
const R = 88, C = 2 * Math.PI * R;
const $ = id => document.getElementById(id);

const lengths = { work: 25, short: 5, long: 15 };
let mode = "work";
let doneInRound = 0;           // focus sessions finished in this round of four
let running = false;
let endsAt = 0;                // performance.now() when the session ends, while running
let leftMs = lengths.work * 60000;   // what is left, while paused
let startedAt = null;          // wall clock when this session first started

// An invented morning: what was logged before the page opened.
const today = new Date();
const at = (h, m) => { const d = new Date(today); d.setHours(h, m, 0, 0); return d; };
let log = [
  { mode: "work",  start: at(8, 5),   mins: 25 },
  { mode: "short", start: at(8, 30),  mins: 5 },
  { mode: "work",  start: at(8, 36),  mins: 25 },
  { mode: "short", start: at(9, 1),   mins: 5 },
  { mode: "work",  start: at(9, 10),  mins: 18, skipped: true },
  { mode: "work",  start: at(10, 40), mins: 25 },
  { mode: "short", start: at(11, 5),  mins: 5 },
  { mode: "work",  start: at(11, 12), mins: 25 },
].filter(s => s.start <= today);
doneInRound = 3;

function css(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
function total() { return lengths[mode] * 60000; }
function remaining(now = performance.now()) { return running ? Math.max(0, endsAt - now) : leftMs; }
function mmss(ms) {
  const s = Math.ceil(ms / 1000);
  return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
}
function hhmm(d) { return d.toTimeString().slice(0, 5); }

function setMode(m, { keepRunning = false } = {}) {
  mode = m;
  leftMs = total();
  startedAt = null;
  if (keepRunning) { running = true; endsAt = performance.now() + leftMs; startedAt = new Date(); }
  else running = false;
  document.documentElement.style.setProperty("--accent", `var(${MODES[m].color})`);
  document.querySelectorAll(".modes button").forEach(b => b.classList.toggle("on", b.dataset.mode === m));
  $("label").textContent = MODES[m].name;
  $("ring").classList.remove("done");
  render();
}

function toggle() {
  if (running) { leftMs = remaining(); running = false; }
  else {
    if (leftMs <= 0) leftMs = total();
    running = true; endsAt = performance.now() + leftMs;
    if (!startedAt) startedAt = new Date();
  }
  render();
}

function reset() { running = false; leftMs = total(); startedAt = null; $("ring").classList.remove("done"); render(); }

function nextMode() {
  if (mode !== "work") return "work";
  return doneInRound >= ROUND ? "long" : "short";
}

function finish(skipped) {
  const elapsed = total() - remaining();
  if (startedAt || !skipped) {
    log.push({ mode, start: startedAt || new Date(), mins: Math.max(0, Math.round(elapsed / 60000)), skipped });
  }
  if (mode === "work" && !skipped) doneInRound++;
  if (mode === "long") doneInRound = 0;
  const wasRunning = running;
  const next = nextMode();
  if (!skipped) { chime(); $("ring").classList.add("done"); toast(mode === "work" ? `Focus done. ${MODES[next].name} next.` : "Break over. Back to it."); }
  setMode(next, { keepRunning: !skipped && wasRunning && $("auto").checked });
  if (!skipped) $("ring").classList.add("done");
  renderLog();
}

function chime() {
  try {
    const ac = new (window.AudioContext || window.webkitAudioContext)();
    [660, 880, 990].forEach((f, i) => {
      const o = ac.createOscillator(), g = ac.createGain();
      o.frequency.value = f; o.type = "sine";
      g.gain.setValueAtTime(0, ac.currentTime + i * .18);
      g.gain.linearRampToValueAtTime(.18, ac.currentTime + i * .18 + .02);
      g.gain.exponentialRampToValueAtTime(.001, ac.currentTime + i * .18 + .6);
      o.connect(g).connect(ac.destination); o.start(ac.currentTime + i * .18); o.stop(ac.currentTime + i * .18 + .7);
    });
  } catch (e) { /* no audio: fine */ }
}

let toastTimer;
function toast(msg) {
  $("toast").textContent = msg; $("toast").classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => $("toast").classList.remove("show"), 2600);
}

// Drawn every animation frame: the ring drains continuously, not once a second.
function frame(now) {
  const left = remaining(now);
  const frac = left / total();
  $("arc").setAttribute("stroke-dasharray", C);
  $("arc").setAttribute("stroke-dashoffset", C * (1 - frac));
  const a = 2 * Math.PI * frac;
  $("tip").setAttribute("cx", 100 + R * Math.cos(a));
  $("tip").setAttribute("cy", 100 + R * Math.sin(a));
  const text = mmss(left);
  if ($("time").textContent !== text) {
    $("time").textContent = text;
    document.title = (running ? "▶ " : "") + text + " · " + MODES[mode].name;
  }
  if (running && left <= 0) finish(false);
  requestAnimationFrame(frame);
}

function render() {
  $("go").textContent = running ? "Pause" : (leftMs < total() ? "Resume" : "Start");
  $("ring").classList.toggle("running", running);
  const dots = $("dots"); dots.innerHTML = "";
  for (let i = 0; i < ROUND; i++) {
    const d = document.createElement("div");
    d.className = "dot" + (i < doneInRound ? " full" : "") + (mode === "work" && i === doneInRound ? " now" : "");
    dots.appendChild(d);
  }
  $("ow").textContent = lengths.work + " min"; $("os").textContent = lengths.short + " min"; $("ol").textContent = lengths.long + " min";
}

function renderLog() {
  const ul = $("log"); ul.innerHTML = "";
  [...log].reverse().forEach(s => {
    const li = document.createElement("li");
    li.innerHTML = `<span class="t">${hhmm(s.start)}</span><span class="sw" style="background:var(${MODES[s.mode].color})"></span>` +
      `<span class="${s.skipped ? "skipped" : ""}">${MODES[s.mode].name}${s.skipped ? " (skipped)" : ""}</span><span class="m">${s.mins} min</span>`;
    ul.appendChild(li);
  });
  if (!log.length) ul.innerHTML = `<li><span></span><span></span><span class="t">Nothing yet today.</span><span></span></li>`;
  const focus = log.filter(s => s.mode === "work");
  $("sFocus").textContent = focus.reduce((a, s) => a + s.mins, 0);
  $("sDone").textContent = focus.filter(s => !s.skipped).length;
  let streak = 0;
  for (const s of [...focus].reverse()) { if (s.skipped) break; streak++; }
  $("sStreak").textContent = streak;
  drawChart();
}

function drawChart() {
  const svg = $("chart"), W = 400, H = 150, top = 14, bottom = 22;
  const hours = []; for (let h = 7; h <= 20; h++) hours.push(h);
  const per = Object.fromEntries(hours.map(h => [h, 0]));
  log.filter(s => s.mode === "work").forEach(s => { const h = s.start.getHours(); if (h in per) per[h] += s.mins; });
  const max = Math.max(60, ...Object.values(per));
  const bw = W / hours.length;
  const nowH = new Date().getHours();
  let out = `<line x1="0" x2="${W}" y1="${H - bottom}" y2="${H - bottom}" stroke="${css("--rule")}"/>`;
  out += `<line x1="0" x2="${W}" y1="${top + (H - top - bottom) * (1 - 60 / max)}" y2="${top + (H - top - bottom) * (1 - 60 / max)}" stroke="${css("--rule")}" stroke-dasharray="3 3"/>`;
  hours.forEach((h, i) => {
    const v = per[h], bh = (H - top - bottom) * v / max;
    out += `<rect class="bar${h === nowH ? " now" : ""}" x="${i * bw + 4}" y="${H - bottom - bh}" width="${bw - 8}" height="${bh}" rx="3"><title>${h}:00 · ${v} min</title></rect>`;
    if (v) out += `<text x="${i * bw + bw / 2}" y="${H - bottom - bh - 4}" text-anchor="middle">${v}</text>`;
    if (h % 2 === 1) out += `<text x="${i * bw + bw / 2}" y="${H - 6}" text-anchor="middle">${h}</text>`;
  });
  svg.innerHTML = out;
}

// Wiring
document.querySelectorAll(".modes button").forEach(b => b.addEventListener("click", () => setMode(b.dataset.mode)));
$("go").addEventListener("click", toggle);
$("reset").addEventListener("click", reset);
$("skip").addEventListener("click", () => finish(true));
[["lw", "work"], ["ls", "short"], ["ll", "long"]].forEach(([id, m]) => {
  const el = $(id); el.value = lengths[m];
  el.addEventListener("input", () => {
    lengths[m] = +el.value;
    if (m === mode && !running && !startedAt) leftMs = total();
    render();
  });
});
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT" && e.target.type !== "range" && e.target.type !== "checkbox") return;
  if (e.code === "Space") { e.preventDefault(); toggle(); }
  else if (e.key === "r" || e.key === "R") reset();
  else if (e.key === "s" || e.key === "S") finish(true);
  else if (e.key === "1") setMode("work");
  else if (e.key === "2") setMode("short");
  else if (e.key === "3") setMode("long");
});
$("today").textContent = today.toLocaleDateString(undefined, { weekday: "long", day: "numeric", month: "long" });

setMode("work");
renderLog();
requestAnimationFrame(frame);
</script>
</body>
</html>
