<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Habits: a year at a glance</title>
<style>
  :root {
    --bg: #f7f7f4; --card: #ffffff; --ink: #1d1f23; --muted: #6b7078; --faint: #b9bdc4;
    --border: #e3e4e0; --empty: #ebedf0; --future: transparent; --accent: #2f7fd6;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15171a; --card: #1d2024; --ink: #e8e9ea; --muted: #9aa0a8; --faint: #4b5058;
      --border: #2c3036; --empty: #2a2e34; --accent: #5aa0ee;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1060px; margin: 0 auto; padding: 32px 24px 64px; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  h1 { font-size: 26px; margin: 0; letter-spacing: -.01em; }
  .today { color: var(--muted); }
  .sub { color: var(--muted); margin: 4px 0 24px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    box-shadow: var(--shadow); padding: 18px 20px; margin-bottom: 16px; }
  .habit-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
  .dot { width: 12px; height: 12px; border-radius: 50%; flex: none; }
  .habit-name { font-weight: 600; font-size: 16px; margin-right: auto; }
  .stats { display: flex; gap: 22px; }
  .stat { text-align: right; }
  .stat b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .stat span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .remove { border: 0; background: none; color: var(--faint); cursor: pointer; font-size: 18px; padding: 0 4px; }
  .remove:hover { color: #d64545; }

  .heat { display: grid; grid-template-columns: 28px 1fr; gap: 4px 6px; overflow-x: auto; }
  .months { grid-column: 2; position: relative; height: 14px; font-size: 11px; color: var(--muted); }
  .months span { position: absolute; top: 0; }
  .wdays { display: grid; grid-template-rows: repeat(7, 13px); gap: 3px; font-size: 10px; color: var(--muted); }
  .cells { display: grid; grid-template-rows: repeat(7, 13px); grid-auto-flow: column;
    grid-auto-columns: 13px; gap: 3px; }
  .cell { width: 13px; height: 13px; border-radius: 3px; background: var(--empty); cursor: pointer;
    transition: transform .12s ease, background-color .2s ease; }
  .cell:hover { transform: scale(1.35); outline: 1.5px solid var(--ink); outline-offset: 0; z-index: 2; }
  .cell.pad { visibility: hidden; }
  .cell.future { background: transparent; border: 1px dashed var(--border); cursor: default; }
  .cell.future:hover { transform: none; outline: none; }
  .cell.today { outline: 1.5px solid var(--muted); }
  .cell.pop { animation: pop .3s ease; }
  @keyframes pop { 40% { transform: scale(1.7); } }

  #tip { position: fixed; pointer-events: none; z-index: 10; background: var(--ink); color: var(--bg);
    padding: 6px 10px; border-radius: 8px; font-size: 12px; white-space: nowrap;
    transform: translate(-50%, -100%); opacity: 0; transition: opacity .1s; }
  #tip.on { opacity: 1; }
  #tip i { font-style: normal; opacity: .7; }

  .row { display: grid; grid-template-columns: 1.6fr 1fr; gap: 16px; }
  @media (max-width: 820px) { .row { grid-template-columns: 1fr; } }
  h2 { font-size: 15px; margin: 0 0 12px; }
  .chart { width: 100%; height: 220px; display: block; }
  .chart text { fill: var(--muted); font-size: 10px; }
  .chart rect { transition: height .35s ease, y .35s ease; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-top: 6px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }

  form { display: grid; gap: 12px; }
  label { font-size: 12px; color: var(--muted); }
  input[type=text] { width: 100%; padding: 9px 11px; border-radius: 9px; border: 1px solid var(--border);
    background: var(--bg); color: var(--ink); font: inherit; }
  input[type=text]:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .swatches { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .sw { width: 26px; height: 26px; border-radius: 50%; border: 2px solid transparent; cursor: pointer;
    transition: transform .1s; }
  .sw:hover { transform: scale(1.12); }
  .sw.sel { border-color: var(--ink); box-shadow: 0 0 0 2px var(--card) inset; }
  input[type=color] { width: 30px; height: 30px; border: 0; padding: 0; background: none; cursor: pointer; }
  button.primary { justify-self: start; padding: 9px 16px; border-radius: 9px; border: 0; font: inherit;
    font-weight: 600; background: var(--accent); color: #fff; cursor: pointer; }
  button.primary:disabled { opacity: .45; cursor: default; }
  .hint { font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<main>
  <header>
    <h1>Habits</h1>
    <div class="today" id="today"></div>
  </header>
  <p class="sub">Click a day to mark it done or undone. Hover for the date. Streaks count back from today.</p>

  <div id="habits"></div>

  <div class="row">
    <section class="card">
      <h2>Days done per week, last 12 weeks</h2>
      <svg class="chart" id="chart" viewBox="0 0 600 220" preserveAspectRatio="none"></svg>
      <div class="legend" id="legend"></div>
    </section>
    <section class="card">
      <h2>Add a habit</h2>
      <form id="add">
        <div>
          <label for="name">Name</label>
          <input type="text" id="name" placeholder="e.g. Stretch for 10 minutes" autocomplete="off">
        </div>
        <div>
          <label>Colour</label>
          <div class="swatches" id="swatches"></div>
        </div>
        <button class="primary" id="addBtn" disabled>Add habit</button>
        <div class="hint">A new habit starts with an empty year.</div>
      </form>
    </section>
  </div>
</main>
<div id="tip"></div>

<script>
// ── Invented data: one character per day of 2026, "1" = done. Today is 27 November 2026.
const YEAR = 2026, DAYS = 365, TODAY = 330;
const PAD = 3; // 1 January 2026 is a Thursday; weeks start on Monday
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const WD = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const MLEN = [31,28,31,30,31,30,31,31,30,31,30,31];

let habits = [
  { name: "Read 20 pages", color: "#2f9e6e", days: "11111111111101110000100111011111111111111111110000111111111000000000011100000111111111011100000000111111111110000010000001111111111111001111100001111011001111000001111110000000001111100000000111000001100001110000001110010000011000000000000001000000000011111111111111111111100000000000001100111111110111100100000111111111111111000110000000000000000000000000000000000" },
  { name: "Morning run", color: "#e07a2f", days: "01110011000110010001010011011111111110111111100110100001100100001111011100011111110001011111111111111111100001101001000001110000000111110000001000001011101000110000111011111000111110100110001101111010000100111111110100100011100111110101111100000000100001101111001011111101100111111111001111111011001111100011001111000011110000011100000000000000000000000000000000000" },
  { name: "Piano practice", color: "#7a5cd6", days: "00011111111111111000011000111111011111100010001101001111011101111000000100111111111010110001110110110011101000100100110000111000111010000000001101111100011110011110001011101111000000100011000111100000010011111111111111111001111111111100000000101100000011110111111101100110001010001011001111111001101011111111111111100011111111111000000000000000000000000000000000000" },
  { name: "No screens after 22", color: "#2f7fd6", days: "11101000010000100110100011011111110001011110000100000000001110000000111111011111111111111101111000011111100101111101101111101111000100000111111100000000001011110000010000000000000111011100111111111100010001111000000110111111111000011100001010111001110111010111111100001110101110010111000111000110011011110111111110010110000111111100000000000000000000000000000000000" },
].map(h => ({ ...h, days: h.days.split("").map(c => c === "1") }));

// ── Dates
const dateOf = d => new Date(YEAR, 0, 1 + d);
const fmtDate = d => { const t = dateOf(d); return `${WD[(d + PAD) % 7]} ${t.getDate()} ${MONTHS[t.getMonth()]} ${YEAR}`; };
const monthStart = m => MLEN.slice(0, m).reduce((a, b) => a + b, 0);
const weekOf = d => Math.floor((d + PAD) / 7);
document.getElementById("today").textContent = "Today: " + fmtDate(TODAY);

// ── Numbers
function streaks(days) {
  let longest = 0, run = 0;
  for (let d = 0; d <= TODAY; d++) { run = days[d] ? run + 1 : 0; longest = Math.max(longest, run); }
  let cur = 0, d = days[TODAY] ? TODAY : TODAY - 1;   // an undone today does not break the streak yet
  while (d >= 0 && days[d]) { cur++; d--; }
  return { cur, longest };
}
function monthPct(days) {
  const m = dateOf(TODAY).getMonth(), s = monthStart(m), n = TODAY - s + 1;
  let done = 0; for (let d = s; d <= TODAY; d++) done += days[d] ? 1 : 0;
  return Math.round(100 * done / n);
}

// ── Heatmaps
const tip = document.getElementById("tip");
function showTip(e, h, d) {
  const status = d > TODAY ? "in the future" : h.days[d] ? "done" : "not done";
  tip.innerHTML = `<b>${fmtDate(d)}</b> <i>· ${h.name}: ${status}</i>`;
  const r = e.target.getBoundingClientRect();
  tip.style.left = (r.left + r.width / 2) + "px"; tip.style.top = (r.top - 6) + "px";
  tip.classList.add("on");
}

function renderHabits() {
  const root = document.getElementById("habits");
  root.innerHTML = "";
  habits.forEach((h, hi) => {
    const card = document.createElement("section");
    card.className = "card";
    const s = streaks(h.days);
    card.innerHTML = `
      <div class="habit-head">
        <span class="dot" style="background:${h.color}"></span>
        <span class="habit-name">${escapeHtml(h.name)}</span>
        <div class="stats">
          <div class="stat"><b data-k="cur">${s.cur}</b><span>current streak</span></div>
          <div class="stat"><b data-k="long">${s.longest}</b><span>longest</span></div>
          <div class="stat"><b data-k="pct">${monthPct(h.days)}%</b><span>${MONTHS[dateOf(TODAY).getMonth()]}</span></div>
        </div>
        <button class="remove" title="Remove habit" aria-label="Remove ${escapeHtml(h.name)}">×</button>
      </div>
      <div class="heat">
        <div class="months"></div>
        <div class="wdays">${WD.map((w, i) => `<span>${i % 2 === 0 ? w : ""}</span>`).join("")}</div>
        <div class="cells"></div>
      </div>`;
    const months = card.querySelector(".months");
    MONTHS.forEach((m, mi) => {
      const span = document.createElement("span");
      span.textContent = m.slice(0, 3);
      span.style.left = (weekOf(monthStart(mi)) * 16) + "px";
      months.appendChild(span);
    });
    const cells = card.querySelector(".cells");
    for (let i = 0; i < PAD; i++) { const p = document.createElement("div"); p.className = "cell pad"; cells.appendChild(p); }
    for (let d = 0; d < DAYS; d++) {
      const c = document.createElement("div");
      c.className = "cell" + (d > TODAY ? " future" : "") + (d === TODAY ? " today" : "");
      if (h.days[d]) c.style.background = h.color;
      c.addEventListener("mouseenter", e => showTip(e, h, d));
      c.addEventListener("mouseleave", () => tip.classList.remove("on"));
      c.addEventListener("click", e => {
        if (d > TODAY) return;
        h.days[d] = !h.days[d];
        c.style.background = h.days[d] ? h.color : "";
        c.classList.remove("pop"); void c.offsetWidth; c.classList.add("pop");
        showTip(e, h, d);
        refreshStats(card, h);
        renderChart();
      });
      cells.appendChild(c);
    }
    card.querySelector(".remove").addEventListener("click", () => {
      habits.splice(hi, 1); renderHabits(); renderChart();
    });
    root.appendChild(card);
  });
}
function refreshStats(card, h) {
  const s = streaks(h.days);
  card.querySelector('[data-k="cur"]').textContent = s.cur;
  card.querySelector('[data-k="long"]').textContent = s.longest;
  card.querySelector('[data-k="pct"]').textContent = monthPct(h.days) + "%";
}
const escapeHtml = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

// ── Weekly stacked bars: days done per week, each habit its colour
function renderChart() {
  const svg = document.getElementById("chart");
  const W = 600, H = 220, L = 26, B = 22, T = 8;
  const last = weekOf(TODAY), first = last - 11;
  const max = Math.max(7, 7 * habits.length);
  const bw = (W - L - 8) / 12;
  let out = "";
  for (let g = 0; g <= max; g += 7) {
    const y = T + (H - T - B) * (1 - g / max);
    out += `<line x1="${L}" x2="${W}" y1="${y}" y2="${y}" stroke="currentColor" stroke-opacity=".1"/>`;
    out += `<text x="${L - 6}" y="${y + 3}" text-anchor="end">${g}</text>`;
  }
  for (let wk = first; wk <= last; wk++) {
    const x = L + (wk - first) * bw + bw * 0.18;
    let base = 0;
    habits.forEach(h => {
      let n = 0;
      for (let k = 0; k < 7; k++) { const d = wk * 7 + k - PAD; if (d >= 0 && d <= TODAY && h.days[d]) n++; }
      const hgt = (H - T - B) * n / max;
      const y = H - B - (H - T - B) * base / max - hgt;
      out += `<rect x="${x}" y="${y}" width="${bw * 0.64}" height="${hgt}" fill="${h.color}" rx="2"><title>${escapeHtml(h.name)}: ${n} days</title></rect>`;
      base += n;
    });
    const mon = Math.max(0, wk * 7 - PAD);
    const t = dateOf(mon);
    out += `<text x="${x + bw * 0.32}" y="${H - 6}" text-anchor="middle">${t.getDate()} ${MONTHS[t.getMonth()].slice(0, 3)}</text>`;
  }
  svg.innerHTML = out;
  svg.style.color = getComputedStyle(document.body).color;
  document.getElementById("legend").innerHTML = habits.map(h =>
    `<span><span class="dot" style="background:${h.color}"></span>${escapeHtml(h.name)}</span>`).join("");
}

// ── Add a habit
const PALETTE = ["#2f9e6e", "#e07a2f", "#7a5cd6", "#2f7fd6", "#d64569", "#c9a227", "#1fa6a6", "#8a8f98"];
let chosen = PALETTE[4];
const sw = document.getElementById("swatches");
function renderSwatches() {
  sw.innerHTML = "";
  PALETTE.forEach(c => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "sw" + (c === chosen ? " sel" : ""); b.style.background = c;
    b.setAttribute("aria-label", "Colour " + c);
    b.addEventListener("click", () => { chosen = c; picker.value = c; renderSwatches(); });
    sw.appendChild(b);
  });
  sw.appendChild(picker);
}
const picker = document.createElement("input");
picker.type = "color"; picker.value = chosen; picker.title = "Any colour";
picker.addEventListener("input", () => { chosen = picker.value; renderSwatches(); });
renderSwatches();

const nameEl = document.getElementById("name"), addBtn = document.getElementById("addBtn");
nameEl.addEventListener("input", () => { addBtn.disabled = nameEl.value.trim() === ""; });
document.getElementById("add").addEventListener("submit", e => {
  e.preventDefault();
  const name = nameEl.value.trim();
  if (!name) return;
  habits.push({ name, color: chosen, days: new Array(DAYS).fill(false) });
  nameEl.value = ""; addBtn.disabled = true;
  renderHabits(); renderChart();
  document.querySelector("#habits .card:last-child").scrollIntoView({ behavior: "smooth", block: "center" });
});

renderHabits();
renderChart();
</script>
</body>
</html>
